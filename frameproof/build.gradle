plugins { id 'com.android.application' }
android {
    namespace 'com.github.ytlog.artdcevm.frameproof'
    compileSdk 37
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.artdcevm.frameproof'
        minSdk 30
        targetSdk 33
        versionCode 1
        versionName '0.1-frame-proof'
        testInstrumentationRunner 'com.github.ytlog.artdcevm.frameproof.FrameProofInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17 -Wall -Wextra -Werror'
            arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        } }
    }
    // A native testing TU does not require Android/ART debuggable policy.
    buildTypes {
        debug { debuggable false; jniDebuggable false; minifyEnabled false }
        release { debuggable false; jniDebuggable false; minifyEnabled false; signingConfig signingConfigs.debug }
        probe { initWith release; debuggable false; jniDebuggable false; signingConfig signingConfigs.debug }
    }
    testBuildType 'probe'
    buildFeatures { prefab true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '4.3.4' } }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/sharedFrameJava').get().asFile
}
dependencies { implementation 'com.bytedance.android:shadowhook:2.0.1' }
// Select original oracle/fixture files; do not clone their parsing or proof logic.
def frameSources = tasks.register('copySharedFrameSources', Copy) {
    from(rootProject.file('app/src/debug/java')) {
        include '**/MethodDexOracle.java', '**/ActiveFrameDexOracle.java', '**/OwnedActiveFrameFixture.java', '**/OwnedActiveFrameCalibration.java'
    }
    from(rootProject.file('artdcevm/src/main/java')) { include '**/internal/CalibrationFixture.java' }
    into layout.buildDirectory.dir('generated/sharedFrameJava')
}
tasks.configureEach { if (name.startsWith('pre') && name.endsWith('Build')) dependsOn frameSources }
// AGP device-test debug policy is separate from the tested build type. Set both
// through the public builder API instead of relying on a manifest merge alone.
androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.deviceTests.values().each { test -> test.debuggable = false }
    }
    onVariants(selector().withBuildType('probe')) { variant ->
        tasks.register('verifyFrameProofPolicy') {
            doLast {
                if (variant.debuggable || variant.deviceTests.isEmpty() || variant.deviceTests.values().any { it.debuggable }) {
                    throw new GradleException('The frame target and instrumentation must both be nondebuggable')
                }
            }
        }
    }
}
