plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}
def targetAbi = providers.gradleProperty('targetAbi').orElse('arm64-v8a').get()
if (targetAbi != 'arm64-v8a') throw new GradleException("Unsupported targetAbi: $targetAbi")
android {
    namespace 'com.github.ytlog.artdcevm'
    compileSdk 37
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 30
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters targetAbi }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17 -Wall -Wextra -Werror'
            arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        } }
    }
    buildFeatures { prefab true }
    // CMake links the prefab shared library; consumers already receive its
    // native files from the transitive Maven dependency. Do not bundle it twice.
    packaging { jniLibs { excludes += ['**/libshadowhook.so', '**/libshadowhook_nothing.so'] } }
    buildTypes { debug { debuggable true; jniDebuggable true; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '4.3.4' } }
}
dependencies {
    // Official ShadowHook; its native library and prefab headers reach consumers transitively.
    implementation 'com.bytedance.android:shadowhook:2.0.1'
}

apply from: rootProject.file('gradle/publish-maven.gradle')
