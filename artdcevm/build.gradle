plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}
def shadowhookSourceDir = layout.buildDirectory.dir('generated/shadowhook/cpp')
def shadowhookLicenseAssets = layout.buildDirectory.dir('generated/shadowhook/licenseAssets')
def targetAbi = providers.gradleProperty('targetAbi').orElse('arm64-v8a').get()
if (targetAbi != 'arm64-v8a') throw new GradleException("Unsupported targetAbi: $targetAbi")
android {
    namespace 'com.github.ytlog.artdcevm'
    compileSdk 37
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 30
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters targetAbi }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17 -Wall -Wextra -Werror'
            arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            arguments '-DARTDCEVM_SHADOWHOOK_SOURCE_DIR=' + shadowhookSourceDir.get().asFile.absolutePath
            targets 'artdcevm', 'shadowhook', 'shadowhook_nothing'
            arguments '-DARTDCEVM_FORCE_CHECKED_HANDLES_TEST=' + (providers.gradleProperty('forceCheckedHandles').orElse('false').get().toBoolean() ? 'ON' : 'OFF')
        } }
    }
    buildTypes { debug { debuggable true; jniDebuggable true; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '4.3.4' } }
}
// Build one official ShadowHook instance with the metadata extension. Its
// native libraries and upstream license/provenance assets travel in this AAR.
def shadowhookTask = tasks.register('prepareShadowHookSource', Exec) {
    inputs.file rootProject.file('tools/prepare-shadowhook-metadata.py')
    inputs.file file('src/main/cpp/support/shadowhook_metadata/exact_function_extent.inc')
    inputs.file file('src/main/cpp/support/shadowhook_metadata/unique_declared_symbol.inc')
    outputs.dir shadowhookSourceDir
    outputs.dir shadowhookLicenseAssets
    commandLine 'python3', rootProject.file('tools/prepare-shadowhook-metadata.py'),
        '--output', shadowhookSourceDir.get().asFile,
        '--assets', shadowhookLicenseAssets.get().asFile
}
android.sourceSets.main.assets.srcDir shadowhookLicenseAssets.get().asFile
tasks.configureEach {
    if (name == 'preBuild' || name.startsWith('configureCMake') ||
        name.startsWith('buildCMake') ||
        (name.startsWith('externalNativeBuild') && !name.startsWith('externalNativeBuildClean'))) {
        dependsOn shadowhookTask
    }
}

apply from: rootProject.file('gradle/publish-maven.gradle')

// These source fixtures are production prerequisites, independent of app tests.
def bootstrapTask = tasks.register('compileProductionBootstrap', Exec) {
    inputs.dir file('src/bootstrap')
    inputs.file rootProject.file('tools/build-production-bootstrap.py')
    inputs.file rootProject.file('tools/source_cache_fixture.py')
    inputs.file rootProject.file('tools/receiver_source_fixture.py')
    outputs.dir layout.buildDirectory.dir('generated/bootstrapAssets')
    commandLine 'python3', rootProject.file('tools/build-production-bootstrap.py'),
        '--sdk', androidComponents.sdkComponents.sdkDirectory.get().asFile,
        '--java', System.getProperty('java.home'),
        '--out', layout.buildDirectory.dir('generated/bootstrapAssets').get().asFile
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/bootstrapAssets').get().asFile)
tasks.configureEach { if (name == 'preBuild') dependsOn bootstrapTask }
