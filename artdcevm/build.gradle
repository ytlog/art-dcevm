plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}
def targetAbi = providers.gradleProperty('targetAbi').orElse('arm64-v8a').get()
if (targetAbi != 'arm64-v8a') throw new GradleException("Unsupported targetAbi: $targetAbi")
android {
    namespace 'com.github.ytlog.artdcevm'
    compileSdk 37
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 30
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters targetAbi }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17 -Wall -Wextra -Werror'
            arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        } }
    }
    sourceSets.main.resources.srcDir layout.buildDirectory.dir("generated/continuationProof").get().asFile
    buildFeatures { prefab true }
    // Prefab links ShadowHook, while its Maven dependency supplies the native
    // files to consumers. Keep a single dependency copy in the application.
    packaging { jniLibs { excludes += ['**/libshadowhook.so', '**/libshadowhook_nothing.so'] } }
    buildTypes { debug { debuggable true; jniDebuggable true; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '4.3.4' } }
}
dependencies {
    // Official ShadowHook; its native library and prefab headers reach consumers transitively.
    implementation 'com.bytedance.android:shadowhook:2.0.1'
}

apply from: rootProject.file('gradle/publish-maven.gradle')

// Production-owned isolated probe DEX; no application bytecode transformation.
def continuationProof = tasks.register('compileContinuationProof', Exec) {
    inputs.dir file('src/probeFixtures')
    inputs.file rootProject.file('tools/build-fixtures.py')
    outputs.dir layout.buildDirectory.dir('generated/continuationProof')
    commandLine 'python3', rootProject.file('tools/build-fixtures.py'),
        '--sdk', androidComponents.sdkComponents.sdkDirectory.get().asFile,
        '--java', System.getProperty('java.home'),
        '--fixtures', file('src/probeFixtures'),
        '--out', layout.buildDirectory.dir('generated/continuationProof').get().asFile
}
tasks.configureEach { if (name == 'preBuild') dependsOn continuationProof }
