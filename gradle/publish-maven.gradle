// Applied by the Android library module. The publishing plugin uses the release
// component, retaining its runtime dependencies in the POM and module metadata.
def publishGroup = providers.gradleProperty('publishGroupId').orElse('io.github.ytlog')
def publishArtifact = providers.gradleProperty('publishArtifactId').orElse('artdcevm')
def publishVersion = providers.gradleProperty('publishVersion')
def artifactName = publishArtifact.get()
def centralEnabled = providers.gradleProperty('enableMavenCentral').orElse('false').get().toBoolean()

mavenPublishing {
    coordinates(publishGroup.get(), artifactName, publishVersion.get())
    pom {
        name = 'ART DCEVM'
        description = 'Structural class redefinition for Android ART: add, remove and change members, modifiers and the class hierarchy at runtime.'
        inceptionYear = '2026'
        url = 'https://github.com/ytlog/art-dcevm'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/license/mit'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'ytlog'
                name = 'ytlog'
                url = 'https://github.com/ytlog'
            }
        }
        scm {
            url = 'https://github.com/ytlog/art-dcevm'
            connection = 'scm:git:https://github.com/ytlog/art-dcevm.git'
            developerConnection = 'scm:git:ssh://git@github.com/ytlog/art-dcevm.git'
        }
    }
    if (centralEnabled) {
        publishToMavenCentral()
        signAllPublications()
    }
}

// Nexus, Artifactory, GitHub Packages, or a file:// repository for local verification.
def repositoryUrl = providers.gradleProperty('publishRepositoryUrl')
if (repositoryUrl.isPresent()) {
    publishing {
        repositories {
            maven {
                name = 'target'
                url = uri(repositoryUrl.get())
                def repositoryUsername = providers.gradleProperty('publishRepositoryUsername')
                def repositoryPassword = providers.gradleProperty('publishRepositoryPassword')
                if (repositoryUsername.isPresent() || repositoryPassword.isPresent()) {
                    credentials {
                        username = repositoryUsername.orNull
                        password = repositoryPassword.orNull
                    }
                }
            }
        }
    }
}

tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    doFirst {
        if (providers.gradleProperty('forceCheckedHandles').orElse('false').get().toBoolean()) {
            throw new GradleException('Do not publish test-only forceCheckedHandles builds.')
        }
    }
}
