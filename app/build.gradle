plugins { id 'com.android.application' }
android {
    namespace 'dev.artdcevm'
    compileSdk 37
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.artdcevm.lab'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0-dev'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' } }
    }
    buildTypes { debug { debuggable true; jniDebuggable true; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '4.3.4' } }
    buildFeatures { prefab true }
    packaging { jniLibs {
        useLegacyPackaging true
        // Prefab also places the same Maven artifact in the native output directory.
        pickFirsts += ['**/libshadowhook.so', '**/libshadowhook_nothing.so']
    } }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/patchAssets').get().asFile
    if (providers.gradleProperty('sourceEngine13').isPresent()) {
        sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/sourceEngine').get().asFile
    }
}
dependencies {
    implementation 'com.bytedance.android:shadowhook:2.0.1'
}
def patchTask = tasks.register('compilePatchFixtures', Exec) {
    inputs.dir rootProject.file('fixtures')
    inputs.file rootProject.file('tools/build-fixtures.py')
    outputs.dir layout.buildDirectory.dir('generated/patchAssets')
    commandLine 'python3', rootProject.file('tools/build-fixtures.py'),
        '--sdk', androidComponents.sdkComponents.sdkDirectory.get().asFile,
        '--java', System.getProperty('java.home'),
        '--out', layout.buildDirectory.dir('generated/patchAssets').get().asFile
}
tasks.named('preBuild').configure { dependsOn patchTask }
if (providers.gradleProperty('sourceEngine13').isPresent()) {
    def sourceEngine = tasks.register('buildSourceEngine13', Exec) {
        inputs.file rootProject.file('tools/android13/build-source-engine.py')
        inputs.file rootProject.file('tools/android13/sources.lock.json')
        inputs.dir rootProject.file('app/src/main/cpp/platform/android13/source_engine')
        inputs.files(['libopenjdkjvmti.so', 'libart.so', 'libartbase.so', 'libdexfile.so', 'libbase.so', 'libc++.so']
                .collect { rootProject.file('runtime-libs/' + it) })
        outputs.file rootProject.file('build/art13-source/libartdcevm_source13.so')
        outputs.file rootProject.file('build/art13-source/build-report.json')
        commandLine 'python3', rootProject.file('tools/android13/build-source-engine.py')
    }
    def packageEngine = tasks.register('packageSourceEngine13', Copy) {
        dependsOn sourceEngine
        from rootProject.file('build/art13-source/libartdcevm_source13.so')
        into layout.buildDirectory.dir('generated/sourceEngine/arm64-v8a')
    }
    tasks.named('preBuild').configure { dependsOn packageEngine }
}
