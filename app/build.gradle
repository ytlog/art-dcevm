plugins { id 'com.android.application' }
def targetAbi = providers.gradleProperty('targetAbi').orElse('arm64-v8a').get()
if (targetAbi != 'arm64-v8a') throw new GradleException("Unsupported targetAbi: $targetAbi")
android {
    namespace 'com.github.ytlog.artdcevm.demo'
    compileSdk 37
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.artdcevm.lab'
        minSdk 30
        targetSdk 33
        versionCode 1
        versionName '0.1.0-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters targetAbi }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17 -Wall -Wextra -Werror'
            arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        } }
    }
    buildTypes { debug { debuggable true; jniDebuggable true; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    externalNativeBuild { cmake { path file('src/debug/cpp/CMakeLists.txt'); version '4.3.4' } }
    packaging { jniLibs {
        useLegacyPackaging true
        // Dependencies may ship other ABIs even though native builds are ARM64 only.
        excludes += ['**/armeabi/**', '**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**']
    } }
    sourceSets.debug.assets.srcDir layout.buildDirectory.dir('generated/patchAssets').get().asFile
}
dependencies {
    implementation project(':artdcevm')
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
def patchTask = tasks.register('compilePatchFixtures', Exec) {
    inputs.dir rootProject.file('fixtures')
    inputs.file rootProject.file('tools/build-fixtures.py')
    outputs.dir layout.buildDirectory.dir('generated/patchAssets')
    commandLine 'python3', rootProject.file('tools/build-fixtures.py'),
        '--sdk', androidComponents.sdkComponents.sdkDirectory.get().asFile,
        '--java', System.getProperty('java.home'),
        '--out', layout.buildDirectory.dir('generated/patchAssets').get().asFile
}
tasks.configureEach { if (name == 'preDebugBuild') dependsOn patchTask }
